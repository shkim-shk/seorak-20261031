// Compute responsive zoom & padding dynamically for current stage dimensions (Portrait 9:16 vs Landscape 16:9)
function getViewportCameraSpec(W_css, H_css) {
  const portrait = H_css >= W_css;
  // In portrait mode, upper 58% is dedicated to the 3D mountain, bottom 34% to stats typography
  const padTop = portrait ? Math.round(H_css * 0.11) : Math.round(H_css * 0.11);
  const padBottom = portrait ? Math.round(H_css * 0.34) : Math.round(H_css * 0.08);
  const padLeft = portrait ? Math.round(W_css * 0.07) : Math.round(W_css * 0.24);
  const padRight = portrait ? Math.round(W_css * 0.07) : Math.round(W_css * 0.06);

  const usableW = Math.max(180, W_css - padLeft - padRight);
  const usableH = Math.max(180, H_css - padTop - padBottom);

  // Meters per CSS pixel at zoom=0 at lat ~37.8 deg (MapLibre 512px tile size)
  const mPerPx0 = (40075016.686 * Math.cos(CAM_CFG.mid_lat * Math.PI / 180)) / 512.0;

  // Projected span in camera space (with 1.25x margin for breathing room & 3D callout pills)
  const effSpanW = CAM_CFG.span_right_m * 1.26;
  const effSpanH = (CAM_CFG.span_fwd_m * Math.cos(CAM_CFG.flight_pitch * Math.PI / 180) +
                    CAM_CFG.alt_span_m * 1.3 * Math.sin(CAM_CFG.flight_pitch * Math.PI / 180)) * 1.28;

  const zoomW = Math.log2((usableW * mPerPx0) / effSpanW);
  const zoomH = Math.log2((usableH * mPerPx0) / effSpanH);
  const flightZoom = Math.max(11.5, Math.min(14.5, Math.min(zoomW, zoomH)));
  const overviewZoom = flightZoom - 0.42;

  return {
    flightZoom,
    overviewZoom,
    padding: { top: padTop, bottom: padBottom, left: padLeft, right: padRight }
  };
}

function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function getStateAtTime(tSec, W_css, H_css) {
  tSec = Math.max(0, Math.min(TOTAL_DURATION_SEC, tSec));
  const spec = getViewportCameraSpec(W_css, H_css);

  let u = 0;
  let introAlpha = 0;
  let camLon = CAM_CFG.mid_lon;
  let camLat = CAM_CFG.mid_lat;
  let zoom = spec.flightZoom;
  let pitch = CAM_CFG.flight_pitch;
  let bearing = CAM_CFG.base_bearing;

  const startBearing = CAM_CFG.base_bearing - CAM_CFG.bearing_sweep_deg * 0.5;
  const endBearing = CAM_CFG.base_bearing + CAM_CFG.bearing_sweep_deg * 0.5;

  if (tSec < INTRO_SEC) {
    const p = smoothstep(0, INTRO_SEC, tSec);
    u = 0;
    if (tSec < 0.4) introAlpha = tSec / 0.4;
    else if (tSec > INTRO_SEC - 0.5) introAlpha = Math.max(0, (INTRO_SEC - tSec) / 0.5);
    else introAlpha = 1.0;

    const pt0 = TRACK[0];
    const targetLon = cameraLockMode === 'fixed' ? CAM_CFG.mid_lon : pt0.cam_lon;
    const targetLat = cameraLockMode === 'fixed' ? CAM_CFG.mid_lat : pt0.cam_lat;

    camLon = CAM_CFG.mid_lon * (1 - p) + targetLon * p;
    camLat = CAM_CFG.mid_lat * (1 - p) + targetLat * p;
    zoom = spec.overviewZoom * (1 - p) + spec.flightZoom * p;
    pitch = CAM_CFG.overview_pitch * (1 - p) + CAM_CFG.flight_pitch * p;
    bearing = cameraLockMode === 'fixed' ? CAM_CFG.base_bearing : startBearing;

  } else if (tSec <= INTRO_SEC + FLIGHT_SEC) {
    u = (tSec - INTRO_SEC) / FLIGHT_SEC;
    u = Math.max(0, Math.min(1, u));

    const idxF = u * (N_PTS - 1);
    const i0 = Math.floor(idxF);
    const i1 = Math.min(i0 + 1, N_PTS - 1);
    const frac = idxF - i0;

    if (cameraLockMode === 'fixed') {
      camLon = CAM_CFG.mid_lon;
      camLat = CAM_CFG.mid_lat;
      bearing = CAM_CFG.base_bearing;
    } else {
      camLon = TRACK[i0].cam_lon * (1 - frac) + TRACK[i1].cam_lon * frac;
      camLat = TRACK[i0].cam_lat * (1 - frac) + TRACK[i1].cam_lat * frac;
      bearing = startBearing + (endBearing - startBearing) * u;
    }
    zoom = spec.flightZoom;
    pitch = CAM_CFG.flight_pitch;

  } else {
    u = 1.0;
    const p = smoothstep(INTRO_SEC + FLIGHT_SEC, TOTAL_DURATION_SEC, tSec);
    const ptLast = TRACK[N_PTS - 1];
    const fromLon = cameraLockMode === 'fixed' ? CAM_CFG.mid_lon : ptLast.cam_lon;
    const fromLat = cameraLockMode === 'fixed' ? CAM_CFG.mid_lat : ptLast.cam_lat;
    const fromBearing = cameraLockMode === 'fixed' ? CAM_CFG.base_bearing : endBearing;

    camLon = fromLon * (1 - p) + CAM_CFG.mid_lon * p;
    camLat = fromLat * (1 - p) + CAM_CFG.mid_lat * p;
    zoom = spec.flightZoom * (1 - p) + spec.overviewZoom * p;
    pitch = CAM_CFG.flight_pitch * (1 - p) + CAM_CFG.overview_pitch * p;
    bearing = fromBearing * (1 - p) + CAM_CFG.base_bearing * p;
  }

  const idxF = u * (N_PTS - 1);
  const i0 = Math.floor(idxF);
  const i1 = Math.min(i0 + 1, N_PTS - 1);
  const frac = idxF - i0;
  const p0 = TRACK[i0];
  const p1 = TRACK[i1];

  const curLon = p0.lon * (1 - frac) + p1.lon * frac;
  const curLat = p0.lat * (1 - frac) + p1.lat * frac;
  const curAlt = p0.alt * (1 - frac) + p1.alt * frac;
  const curDistM = p0.dist * (1 - frac) + p1.dist * frac;
  const curElapsedSec = p0.elapsed_sec * (1 - frac) + p1.elapsed_sec * frac;

  // Quantize live HUD counters (~25 discrete steps across entire flight) so numbers change calmly (~1x per second)
  const qStep = Math.floor(u * 25) / 25;
  const qIdx = Math.min(N_PTS - 1, Math.floor(qStep * (N_PTS - 1)));
  const qPt = TRACK[qIdx];

  // Single active passing milestone (only during Act 2 flight)
  let activeMilestone = null;
  if (tSec >= INTRO_SEC && tSec <= INTRO_SEC + FLIGHT_SEC) {
    for (let i = 0; i < MILESTONES.length; i++) {
      const m = MILESTONES[i];
      if (u >= m.u_in && u <= m.u_out) {
        const span = m.u_out - m.u_in;
        const fadeW = Math.min(0.015, span * 0.28);
        let alpha = 1.0;
        if (u < m.u_in + fadeW) {
          alpha = smoothstep(m.u_in, m.u_in + fadeW, u);
        } else if (u > m.u_out - fadeW) {
          alpha = 1.0 - smoothstep(m.u_out - fadeW, m.u_out, u);
        }
        activeMilestone = { ...m, alpha };
        break;
      }
    }
  }

  return {
    tSec, u, introAlpha,
    camLon, camLat, zoom, pitch, bearing, padding: spec.padding,
    i0, curLon, curLat, curAlt, curDistM, curElapsedSec,
    qPt, activeMilestone
  };
}

function renderSceneAtTime(tSec) {
  elapsedAnimSec = Math.max(0, Math.min(TOTAL_DURATION_SEC, tSec));
  const st = getStateAtTime(elapsedAnimSec, stageEl.clientWidth, stageEl.clientHeight);

  if (map.getSource('route-progress')) {
    const sliceCoords = fullCoords.slice(0, st.i0 + 1);
    sliceCoords.push([st.curLon, st.curLat]);
    if (sliceCoords.length >= 2) {
      map.getSource('route-progress').setData({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: sliceCoords }
      });
    }
  }

  map.jumpTo({
    center: [st.camLon, st.camLat],
    zoom: st.zoom,
    pitch: st.pitch,
    bearing: st.bearing,
    padding: st.padding
  });

  document.getElementById('scrubber').value = Math.round((elapsedAnimSec / TOTAL_DURATION_SEC) * 1000);

  const dpr = window.devicePixelRatio || 1;
  drawHudOverlay(hudCtx, hudCanvas.width, hudCanvas.height, dpr, elapsedAnimSec);
}

function drawHudOverlay(ctx, W, H, scale, tSec, clearCanvas = true) {
  if (clearCanvas) ctx.clearRect(0, 0, W, H);
  const W_css = W / scale;
  const H_css = H / scale;
  const portrait = H_css >= W_css;
  const st = getStateAtTime(tSec, W_css, H_css);

  // Typography responsive scaling for Portrait (9:16) vs Landscape (16:9)
  const uiScale = portrait ? Math.min(scale * (W_css / 410), scale * 1.15) : scale;

  // Bottom vignette for crisp white typography readability
  const vigTop = portrait ? H * 0.56 : H * 0.55;
  const grad = ctx.createLinearGradient(0, vigTop, 0, H);
  grad.addColorStop(0, 'rgba(5, 9, 18, 0)');
  grad.addColorStop(0.45, 'rgba(5, 9, 18, 0.55)');
  grad.addColorStop(1, 'rgba(5, 9, 18, 0.86)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, vigTop, W, H - vigTop);

  // 1. Project & Draw Moving Hiker Dot (●) on 3D Terrain
  if (st.u > 0.001 && st.u < 0.999) {
    const ptScreen = map.project([st.curLon, st.curLat]);
    const sx = ptScreen.x * scale;
    const sy = ptScreen.y * scale;

    ctx.save();
    ctx.beginPath();
    ctx.arc(sx, sy, 12.5 * uiScale, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(14, 165, 233, 0.30)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sx, sy, 8.2 * uiScale, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
    ctx.shadowBlur = 8 * uiScale;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(sx, sy, 5.5 * uiScale, 0, Math.PI * 2);
    ctx.fillStyle = '#0284c7';
    ctx.fill();
    ctx.restore();
  }

  // 2. Ephemeral Passing Milestone Callout (ONLY 1 at a time from curated 6-7 landmarks)
  if (st.activeMilestone && st.activeMilestone.alpha > 0.01) {
    const m = st.activeMilestone;
    const mScreen = map.project([m.lon, m.lat]);
    const mx = mScreen.x * scale;
    const my = mScreen.y * scale;

    ctx.save();
    ctx.globalAlpha = m.alpha;

    ctx.beginPath();
    ctx.arc(mx, my, 12 * uiScale, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.9)';
    ctx.lineWidth = 2.2 * uiScale;
    ctx.stroke();

    const titleText = `${m.name} · ${m.alt.toLocaleString()}m`;
    const subText = `${m.time ? m.time + ' 통과 · ' : ''}누적 ${m.dist_km.toFixed(1)} km`;

    ctx.font = `700 ${Math.round(15.5 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    const w1 = ctx.measureText(titleText).width;
    ctx.font = `600 ${Math.round(12.5 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    const w2 = ctx.measureText(subText).width;

    const padX = 14 * uiScale;
    const boxW = Math.max(w1, w2) + padX * 2;
    const boxH = 50 * uiScale;
    const stemH = 30 * uiScale;

    const marginX = 16 * uiScale;
    const boxX = Math.max(marginX, Math.min(W - boxW - marginX, mx - boxW / 2));
    // Place above the point unless too close to top control bar
    const topLimit = 64 * uiScale;
    let boxY = my - stemH - boxH;
    let stemStartY = my - 9 * uiScale;
    let stemEndY = my - stemH;

    if (boxY < topLimit) {
      boxY = my + stemH;
      stemStartY = my + 9 * uiScale;
      stemEndY = my + stemH;
    }

    ctx.beginPath();
    ctx.moveTo(mx, stemStartY);
    ctx.lineTo(mx, stemEndY);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';
    ctx.lineWidth = 2 * uiScale;
    ctx.stroke();

    ctx.fillStyle = 'rgba(11, 18, 34, 0.92)';
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.85)';
    ctx.lineWidth = 1.8 * uiScale;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
    ctx.shadowBlur = 14 * uiScale;
    roundRect(ctx, boxX, boxY, boxW, boxH, 11 * uiScale);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = `700 ${Math.round(15.5 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(titleText, boxX + padX, boxY + 22 * uiScale);

    ctx.fillStyle = '#fde68a';
    ctx.font = `600 ${Math.round(12.5 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(subText, boxX + padX, boxY + 40 * uiScale);

    ctx.restore();
  }

  // 3. Intro Center Title Card (0.0s - 2.0s)
  if (st.introAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = st.introAlpha;
    ctx.fillStyle = 'rgba(6, 10, 18, 0.52)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
    ctx.shadowBlur = 16 * uiScale;

    const cx = W / 2;
    const cy = H * 0.42;
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 3.2 * uiScale;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 22 * uiScale, cy + 10 * uiScale);
    ctx.lineTo(cx - 4 * uiScale, cy - 16 * uiScale);
    ctx.lineTo(cx + 5 * uiScale, cy - 2 * uiScale);
    ctx.lineTo(cx + 13 * uiScale, cy - 11 * uiScale);
    ctx.lineTo(cx + 24 * uiScale, cy + 10 * uiScale);
    ctx.closePath();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = `800 ${Math.round(26 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(META.title, cx, H * 0.49);

    ctx.fillStyle = '#cbd5e1';
    ctx.font = `500 ${Math.round(14 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(META.date, cx, H * 0.53);
    ctx.fillText(META.subtitle, cx, H * 0.56);

    ctx.restore();
  }

  // 4. Lower-Left Coarse-Unit Calm Stats Overlay (Updates ~1x/sec in large units: 0.5km, 10min, 20m)
  const hudAlpha = Math.max(0, Math.min(1, 1 - st.introAlpha * 0.95));
  if (hudAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = hudAlpha;
    const leftX = (portrait ? 26 : 36) * uiScale;
    let baseY = H - (portrait ? 28 : 34) * uiScale;

    ctx.shadowColor = 'rgba(0, 0, 0, 0.88)';
    ctx.shadowBlur = 10 * uiScale;

    const isEnd = st.u >= 0.985;

    // Metric 3 (Bottom): Elevation (Quantized to 20m steps so it changes calmly)
    ctx.fillStyle = '#cbd5e1';
    ctx.font = `500 ${Math.round(12 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(`해발고도 (최고 ${META.maxAlt.toLocaleString()} m · 누적상승 ${META.elevGain.toLocaleString()} m)`, leftX, baseY);

    baseY -= 18 * uiScale;
    const coarseAlt = isEnd ? META.maxAlt : Math.round(st.qPt.alt / 20) * 20;
    ctx.fillStyle = '#ffffff';
    ctx.font = `800 ${Math.round(29 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(`${coarseAlt.toLocaleString()} m`, leftX, baseY);

    // Metric 2 (Middle): Elapsed Time (Quantized to 10-minute increments, no spinning seconds!)
    baseY -= 34 * uiScale;
    ctx.fillStyle = '#cbd5e1';
    ctx.font = `500 ${Math.round(12 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(`소요시간 (${META.startKst} 출발 ~ ${META.endKst} 도착)`, leftX, baseY);

    baseY -= 18 * uiScale;
    const rawMin = Math.floor(st.qPt.elapsed_sec / 60);
    const totalMin = Math.round(META.totalElapsedSec / 60);
    // Step by 10-minute blocks during flight, show exact total minutes at finish
    const dispMin = isEnd ? totalMin : Math.floor(rawMin / 10) * 10;
    const hh = Math.floor(dispMin / 60);
    const mm = String(dispMin % 60).padStart(2, '0');
    ctx.fillStyle = '#ffffff';
    ctx.font = `800 ${Math.round(29 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(`${hh}시간 ${mm}분`, leftX, baseY);

    // Metric 1 (Top): Distance (Quantized to 0.5 km steps during flight, exact total at finish)
    baseY -= 34 * uiScale;
    ctx.fillStyle = '#cbd5e1';
    ctx.font = `500 ${Math.round(12 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(`산행거리 (총 ${META.totalDistKm.toFixed(2)} km)`, leftX, baseY);

    baseY -= 18 * uiScale;
    const rawKm = st.qPt.dist / 1000.0;
    const coarseKm = Math.floor(rawKm * 2) / 2; // 0.0, 0.5, 1.0, 1.5, 2.0 ...
    const distText = isEnd ? `${META.totalDistKm.toFixed(2)} km` : `${coarseKm.toFixed(1)} km`;
    ctx.fillStyle = '#ffffff';
    ctx.font = `800 ${Math.round(29 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(distText, leftX, baseY);

    // Route Header above stats (Replaces AllTrails logo)
    baseY -= 38 * uiScale;
    ctx.fillStyle = '#4ade80';
    ctx.font = `700 ${Math.round(12 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(`${META.date}  ·  ${META.subtitle}`, leftX, baseY);

    baseY -= 20 * uiScale;
    ctx.fillStyle = '#ffffff';
    ctx.font = `800 ${Math.round(18.5 * uiScale)}px -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif`;
    ctx.fillText(META.title, leftX, baseY);

    ctx.restore();
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================================
// Playback & UI Controls
// ============================================================================
function tickAnimation(now) {
  if (!isPlaying) return;
  if (!lastFrameTime) lastFrameTime = now;
  const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  elapsedAnimSec += dt;
  if (elapsedAnimSec >= TOTAL_DURATION_SEC) {
    elapsedAnimSec = TOTAL_DURATION_SEC;
    renderSceneAtTime(elapsedAnimSec);
    stopPlayback();
    return;
  }

  renderSceneAtTime(elapsedAnimSec);
  animReqId = requestAnimationFrame(tickAnimation);
}

function startPlayback() {
  if (elapsedAnimSec >= TOTAL_DURATION_SEC - 0.05) elapsedAnimSec = 0;
  isPlaying = true;
  lastFrameTime = 0;
  document.getElementById('btnPlay').textContent = '❚❚ 정지';
  animReqId = requestAnimationFrame(tickAnimation);
}

function stopPlayback() {
  isPlaying = false;
  if (animReqId) cancelAnimationFrame(animReqId);
  document.getElementById('btnPlay').textContent = '▶ 재생';
}

document.getElementById('btnPlay').addEventListener('click', () => {
  if (isPlaying) stopPlayback(); else startPlayback();
});

document.getElementById('scrubber').addEventListener('input', (e) => {
  if (isPlaying) stopPlayback();
  const ratio = parseFloat(e.target.value) / 1000;
  renderSceneAtTime(ratio * TOTAL_DURATION_SEC);
});

document.getElementById('btnAspect').addEventListener('click', (e) => {
  isPortrait = !isPortrait;
  if (isPortrait) {
    document.body.classList.remove('mode-landscape');
    document.body.classList.add('mode-portrait');
    e.target.textContent = '📱 세로';
  } else {
    document.body.classList.remove('mode-portrait');
    document.body.classList.add('mode-landscape');
    e.target.textContent = '🖥️ 가로';
  }
  setTimeout(resizeStage, 280);
});

document.getElementById('btnCamMode').addEventListener('click', (e) => {
  if (cameraLockMode === 'gentle') {
    cameraLockMode = 'fixed';
    e.target.textContent = '🎥 고정';
  } else {
    cameraLockMode = 'gentle';
    e.target.textContent = '🎥 완만';
  }
  renderSceneAtTime(elapsedAnimSec);
});

window.seekToSeconds = function(sec) {
  if (isPlaying) stopPlayback();
  renderSceneAtTime(sec);
};

// ============================================================================
// Video Recording (Matches current Portrait 1080x1920 or Landscape 1920x1080)
// ============================================================================
let recCancel = false;
document.getElementById('btnCancelRec').addEventListener('click', () => {
  recCancel = true;
});

document.getElementById('btnRecord').addEventListener('click', async () => {
  if (isRecording) return;
  if (isPlaying) stopPlayback();

  isRecording = true;
  recCancel = false;
  const recModal = document.getElementById('recModal');
  const recStatus = document.getElementById('recStatusText');
  recModal.classList.add('active');

  const recCanvas = document.getElementById('recordCanvas');
  const portraitNow = stageEl.clientHeight >= stageEl.clientWidth;
  recCanvas.width = portraitNow ? 1080 : 1920;
  recCanvas.height = portraitNow ? 1920 : 1080;

  const recCtx = recCanvas.getContext('2d');
  const stream = recCanvas.captureStream(60);

  let mimeType = 'video/mp4;codecs=avc1';
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    mimeType = 'video/webm;codecs=vp9';
  }
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    mimeType = 'video/webm';
  }

  const chunks = [];
  const recorder = new MediaRecorder(stream, {
    mimeType,
    videoBitsPerSecond: 16000000
  });

  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    isRecording = false;
    recModal.classList.remove('active');
    if (recCancel) return;
    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    a.href = url;
    a.download = `${META.date}_${META.title.replace(/\s+/g, '_')}_3D비행.${ext}`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 2000);
  };

  recorder.start();

  const fps = 60;
  const totalFrames = Math.round(TOTAL_DURATION_SEC * fps);
  const mapCanvas = map.getCanvas();
  const recScale = recCanvas.width / stageEl.clientWidth;

  for (let f = 0; f <= totalFrames; f++) {
    if (recCancel) break;
    const tSec = (f / totalFrames) * TOTAL_DURATION_SEC;
    renderSceneAtTime(tSec);

    await new Promise(r => requestAnimationFrame(r));

    recCtx.clearRect(0, 0, recCanvas.width, recCanvas.height);
    recCtx.drawImage(mapCanvas, 0, 0, recCanvas.width, recCanvas.height);
    drawHudOverlay(recCtx, recCanvas.width, recCanvas.height, recScale, tSec, false);

    if (f % 15 === 0) {
      recStatus.textContent = `비디오 렌더링 중... (${Math.round((f / totalFrames) * 100)}%)`;
    }
  }

  recorder.stop();
});
</script>
