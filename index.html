<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(circle at 50% 0%, #163326 0%, #08110d 75%); color: #f0fdf4;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    min-height: 100dvh; padding: max(28px, env(safe-area-inset-top)) 18px max(36px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; justify-content: center; }
  .wrap { max-width: 520px; width: 100%; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.3; color: #fff; margin-bottom: 22px; }
  .card { background: rgba(20,39,31,0.88); border: 1px solid rgba(52,211,153,0.25); border-radius: 20px; padding: 22px 20px;

  .meta { font-size: 13px; color: #34d399; font-weight: 700; margin-bottom: 8px; }
  .course { font-size: 13.5px; color: #d1fae5; line-height: 1.55; margin-bottom: 18px; padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1); }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 14px; }
  .stat span { display: block; font-size: 11.5px; color: #94a3b8; margin-bottom: 3px; }
  .stat strong { font-size: clamp(14.5px, 4.1vw, 17px); font-weight: 800; color: #fff; white-space: nowrap; }
  .actions { display: flex; flex-direction: column; gap: 12px; }
  .btn { display: flex; align-items: center; justify-content: space-between; text-decoration: none; padding: 16px 18px;
    border-radius: 14px; font-size: 16px; font-weight: 700; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #34d399; color: #052e16; }
  .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.18); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>2026.10.31 설악산 산행 기록</h1>
    <div class="card">
      <div class="meta">05:58 출발 · 14:52 종료 · 단독 산행</div>

      <div class="actions">
        <a class="btn btn-primary" href="./record.html"><span>📋 산행 기록 및 지형도</span><span>→</span></a>
        <a class="btn btn-secondary" href="./flyover.html"><span>🏔️ 3D 입체 비행 영상</span><span>→</span></a>
      </div>
    </div>
  </div>
